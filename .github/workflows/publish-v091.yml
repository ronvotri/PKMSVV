name: Publish direct-download v0.9.1 files

on:
  push:
    paths:
      - .github/workflows/publish-v091.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Put verified v0.9.1 builds on GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified Android artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39621746295
          name: PKMSVV-Android-APK-debug
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming/android

      - name: Fetch verified Windows artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39621746262
          name: PKMSVV-Windows-Offline-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming/windows

      - name: Fetch verified Switch offline archive
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 39621746323
          name: PKMSVV-Switch-Brewser-Offline-Test
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming/switch

      - name: Verify expected files and prepare download names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t apks < <(find incoming/android -type f -name '*.apk')
          mapfile -t exes < <(find incoming/windows -type f -name '*.exe')
          mapfile -t zips < <(find incoming/switch -type f -name '*.zip')
          test "${#apks[@]}" -eq 1
          test "${#exes[@]}" -eq 1
          test "${#zips[@]}" -eq 1
          cp "${apks[0]}" release/Pokemon-Survivor-v0.9.1-Android-universal.apk
          cp "${exes[0]}" release/Pokemon-Survivor-v0.9.1-Windows-PC-x64.exe
          cp "${zips[0]}" release/Pokemon-Survivor-v0.9.1-Switch-Lite-Offline.zip
          find release -maxdepth 1 -type f -exec ls -lh {} \;
          sha256sum release/*

      - name: Publish official repository download assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.9.1 release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.9.1 release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pokémon Survivor – Votri Valley v0.9.1" \
              --notes "Unofficial noncommercial offline build for Windows, Android and Switch Brewser. Controller updates: Gacha Continue, Pokémon evolution selection, Start to play after picking Pokémon. Android APK is debug-signed; back up your save before uninstalling or upgrading. Switch ZIP is an offline Brewser homebrew package, not an independent NSP."
          fi
          gh release view v0.9.1 --repo "$GITHUB_REPOSITORY" --json url,assets

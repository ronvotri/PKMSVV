name: Build Switch Lite Brewser Offline Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    name: Build noncommercial Switch SD offline package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned PokéSurvivor source
        shell: bash
        run: |
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/JPTER78/pokesurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 11fe868c640b62ac37beacc222e056bc4d9ec892
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test original gameplay and translations
        run: npm run test:evolution && npm run test:i18n
      - name: Apply PKMSVV gameplay patches
        run: npm run prepare:game
      - name: Test skill casts and evolution/UI
        run: npm run test:autocast && npm run test:global && npm run test:collection && npm run test:controller && npm run test:balance && npm run test:ux && npm run test:dash
      - name: Make icon and mobile-style offline files
        run: npm run prepare:icons && npm run prepare:android && npm run test:android
      - name: Package SD Switch folder
        run: npm run prepare:switch && npm run test:switch
      - name: Render Switch NRO icon with Survivor Poké Ball
        run: |
          node -e "require('sharp')('build/icon.png').resize(256,256).jpeg({quality:90}).toFile('switch/nro-forwarder/icon.jpg').catch(e=>{console.error(e);process.exit(1)})"
      - name: Compile native launcher NRO with devkitPro / libnx
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/switch/nro-forwarder \
            -e DEVKITPRO=/opt/devkitpro \
            devkitpro/devkita64:20260219 \
            make -j2
          test -s switch/nro-forwarder/PKMSVV.nro
          python3 - <<'PY'
          from pathlib import Path
          nro=Path('switch/nro-forwarder/PKMSVV.nro')
          data=nro.read_bytes()
          assert data[0x10:0x14] == b'NRO0', 'Not a valid Nintendo Switch NRO'
          print(f'PKMSVV.nro: {len(data):,} bytes, NRO0 verified')
          PY
          cp switch/nro-forwarder/PKMSVV.nro dist/switch-package/switch/PKMSVV.nro
      - name: Upload standalone PKMSVV hbmenu launcher NRO
        uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-Switch-NRO-Launcher
          path: switch/nro-forwarder/PKMSVV.nro
          retention-days: 14
          if-no-files-found: error
      - name: Bundle official Brewser NRO and optional Home Menu NSP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/switch-package/switch dist/switch-package/NSP_TUY_CHON
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o dist/switch-package/switch/brewser.nro "https://github.com/natureglass/Brewser/releases/download/v0.1.1.31/brewser.nro"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 -o dist/switch-package/NSP_TUY_CHON/brewser-forwarder.nsp "https://github.com/natureglass/Brewser/releases/download/v0.1.1.31/brewser-forwarder.nsp"
          echo "8ce31f5b7dfb617c18a705d0c5fc955b59f60d445b5a76e250a1dd98ccd04b13  dist/switch-package/switch/brewser.nro" | sha256sum -c -
          echo "1e3268fe83d45a811c38366645ed59854d6a0a4243de9c97ab156ffdc1a33af8  dist/switch-package/NSP_TUY_CHON/brewser-forwarder.nsp" | sha256sum -c -
          curl -fL --retry 3 -o dist/switch-package/NSP_TUY_CHON/BREWSER_LICENSE_MPL-2.0.txt "https://raw.githubusercontent.com/natureglass/Brewser/main/LICENSE"
          printf '%s\n' "Brewser v0.1.1.31: https://github.com/natureglass/Brewser/releases/tag/v0.1.1.31" "Source: https://github.com/natureglass/Brewser" "NSP file opens Brewser, NOT Pokémon Survivor." > dist/switch-package/NSP_TUY_CHON/BREWSER_NGUON_GOC.txt
      - name: Create offline ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('dist/switch-package')
          path=Path('dist/PKMSVV-Switch-Brewser-Offline-Test.zip')
          with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root))
          with zipfile.ZipFile(path) as z: assert z.testzip() is None
          print(path,round(path.stat().st_size/1048576,1),'MiB')
          PY
      - name: Upload Switch test package — NOT NRO
        uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-Switch-Brewser-Offline-Test
          path: dist/PKMSVV-Switch-Brewser-Offline-Test.zip
          retention-days: 14
          if-no-files-found: error
